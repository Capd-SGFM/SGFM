services:
  database:
    image: timescale/timescaledb:2.15.1-pg15
    container_name: database
    restart: always
    ports:
      - "5432:5432"
    env_file:
      - .env.server
    volumes:
      - db_data:/var/lib/postgresql/data
      - ./init_schema:/docker-entrypoint-initdb.d
    networks:
      - trading_net

  redis:
    image: redis:7-alpine
    container_name: redis
    restart: always
    ports:
      - "6379:6379"
    networks:
      - trading_net

  backend:
    build:
      context: .
      dockerfile: ./DB_backend/Dockerfile.server
    container_name: backend
    depends_on:
      - database
      - redis
    restart: always
    env_file:
      - .env.server
    ports:
      - "8000:8000"
    working_dir: /app
    volumes:
      - ./DB_backend:/app
    networks:
      - trading_net

  paper_trading:
    build:
      context: .
      dockerfile: ./paper_trading_backend/Dockerfile
    container_name: paper_trading
    depends_on:
      - database
      - redis
    restart: always
    env_file:
      - .env.server
    ports:
      - "8003:8003"
    working_dir: /app
    volumes:
      - ./paper_trading_backend:/app
    networks:
      - trading_net

  worker_cpu:
    build:
      context: .
      dockerfile: ./DB_backend/Dockerfile.server
    container_name: worker_cpu
    depends_on:
      - database
      - redis
      - backend
    restart: always
    env_file:
      - .env.server
    working_dir: /app
    volumes:
      - ./DB_backend:/app
    # 🚀 CPU Worker: Handles API, WebSocket, General Tasks (Queue: celery)
    command: celery -A celery_task worker --pool=threads --concurrency=24 -Q celery --loglevel=info
    environment:
      - PYTHONPATH=/app
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
    networks:
      - trading_net

  worker_indicator:
    build:
      context: .
      dockerfile: ./DB_backend/Dockerfile.server
    container_name: worker_indicator
    depends_on:
      - database
      - redis
      - backend
    restart: always
    env_file:
      - .env.server
    working_dir: /app
    volumes:
      - ./DB_backend:/app
    # 🚀 Indicator Worker: Handles Indicator Calculations (Queue: indicators)
    # Uses GPU via prefork pool
    command: celery -A celery_task worker --pool=prefork --concurrency=4 --autoscale=${CELERY_WORKER_AUTOSCALE:-4,2} -Q indicators --loglevel=info
    environment:
      - PYTHONPATH=/app
      - NVIDIA_VISIBLE_DEVICES=all
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    networks:
      - trading_net

  websocket:
    build:
      context: .
      dockerfile: ./DB_backend/Dockerfile.server
    container_name: websocket
    restart: always
    working_dir: /app
    volumes:
      - ./DB_backend:/app
    # 🚀 Dedicated Worker for WebSocket (Queue: websocket)
    command: celery -A celery_task worker --pool=threads --concurrency=4 -n websocket@%h -Q websocket --loglevel=info
    environment:
      - PYTHONPATH=/app
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
    env_file:
      - .env.server
    depends_on:
      - redis
      - database
    networks:
      - trading_net

  frontend:
    build:
      context: ./Frontend
      dockerfile: Dockerfile.server
      args:
        VITE_BACKEND_URL: ${VITE_BACKEND_URL}
        VITE_BACKTESTING_BACKEND_URL: ${VITE_BACKTESTING_BACKEND_URL}
        VITE_GOOGLE_CLIENT_ID: ${VITE_GOOGLE_CLIENT_ID}
    container_name: frontend
    depends_on:
      - backend
    ports:
      - "80:80"
    env_file:
      - .env.server
    networks:
      - trading_net
    
  backtesting_backend:
    build:
      context: .
      dockerfile: ./backtesting_backend/Dockerfile.server
    container_name: backtesting_backend
    depends_on:
      - database
      - redis
    restart: always
    env_file:
      - .env.server
    ports:
      - "8002:8002"
    working_dir: /app
    volumes:
      - ./backtesting_backend:/app
    networks:
      - trading_net




networks:
  trading_net:
    driver: bridge

volumes:
  db_data:
