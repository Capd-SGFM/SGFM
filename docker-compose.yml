services:
  database:
    image: timescale/timescaledb:2.15.1-pg15
    container_name: database
    restart: always
    ports:
      - "5432:5432"
    env_file:
      - .env
    volumes:
      - db_data:/var/lib/postgresql/data
      - ./init_schema:/docker-entrypoint-initdb.d
    networks:
      - trading_net

  redis:
    image: redis:7-alpine
    container_name: redis
    restart: always
    ports:
      - "6379:6379"
    networks:
      - trading_net

  backend:
    build:
      context: .
      dockerfile: ./DB_backend/Dockerfile
      target: dev
    container_name: backend
    depends_on:
      - database
      - redis
    restart: always
    env_file:
      - .env
    ports:
      - "8080:8000"
    working_dir: /app
    volumes:
      - ./DB_backend:/app
    environment:
      FRONTEND_URL: http://localhost:5173
    networks:
      - trading_net

  paper_trading:
    build:
      context: .
      dockerfile: ./paper_trading_backend/Dockerfile
    container_name: paper_trading
    depends_on:
      - database
      - redis
    restart: always
    env_file:
      - .env
    ports:
      - "8003:8003"
    working_dir: /app
    volumes:
      - ./paper_trading_backend:/app
    networks:
      - trading_net

  worker:
    build:
      context: .
      dockerfile: ./DB_backend/Dockerfile
    container_name: worker
    command: celery -A celery_task.celery_app worker --loglevel=info --concurrency=16
    depends_on:
      - database
      - redis
      - backend
    restart: always
    env_file:
      - .env
    working_dir: /app
    volumes:
      - ./DB_backend:/app
    environment:
      - PYTHONPATH=/app
    networks:
      - trading_net

  websocket:
    build:
      context: .
      dockerfile: ./DB_backend/Dockerfile
    container_name: websocket
    restart: always
    working_dir: /app
    volumes:
      - ./DB_backend:/app
    command: celery -A celery_task worker --pool=threads --concurrency=4 -n websocket@%h -Q websocket --loglevel=info
    environment:
      - PYTHONPATH=/app
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
    env_file:
      - .env
    depends_on:
      - redis
      - database
    networks:
      - trading_net

  frontend:
    build:
      context: ./Frontend
      dockerfile: Dockerfile
      target: dev
    container_name: frontend
    depends_on:
      - backend
      - paper_trading
    ports:
      - "5173:5173"
    env_file:
      - .env
    volumes:
      - ./Frontend:/app
      - /app/node_modules
    environment:
    - CHOKIDAR_USEPOLLING=true
    - WATCHPACK_POLLING=true
    networks:
      - trading_net
    
  backtesting_backend:
    build:
      context: .
      dockerfile: ./backtesting_backend/Dockerfile
      target: dev
    container_name: backtesting_backend
    depends_on:
      - database
      - redis
    restart: always
    env_file:
      - .env
    ports:
      - "8090:8002"
    working_dir: /app
    volumes:
      - ./backtesting_backend:/app
    environment:
      FRONTEND_URL: http://localhost:5173
    networks:
      - trading_net


networks:
  trading_net:
    driver: bridge

volumes:
  db_data: